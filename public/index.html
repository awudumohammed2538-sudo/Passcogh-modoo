<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087443">
<meta name="description" content="PASSCOGH-MODOO — Learn, Practise, Pass. A Ghana-focused learning, revision, practical and tertiary guidance platform.">
<title>PASSCOGH-MODOO | Learn • Practise • Pass</title>
<style>
:root{
  --green:#087443;--green2:#0b8a52;--gold:#f4b400;--navy:#102a43;
  --ink:#14213d;--muted:#667085;--bg:#f5f8f7;--card:#fff;--line:#e4e9e7;
  --soft:#eaf7f0;--orange:#f97316;--purple:#6d28d9;--shadow:0 14px 40px rgba(16,42,67,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.65}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1280px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:220px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--green),var(--green2));display:grid;place-items:center;color:#fff;font-weight:950;font-size:20px;box-shadow:0 8px 20px rgba(8,116,67,.2)}
.brand strong{display:block;font-size:15px;letter-spacing:.02em}.brand small{color:var(--muted);font-size:11px}
.search{flex:1;max-width:500px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:#f8faf9;border-radius:14px;padding:11px 14px 11px 40px;outline:0}
.search span{position:absolute;left:14px;top:9px}
.header-actions{margin-left:auto;display:flex;gap:7px}
.icon-btn,.menu-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-weight:800}
.menu-btn{display:none}
.layout{max-width:1280px;margin:auto;display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 65px)}
.sidebar{border-right:1px solid var(--line);padding:18px 12px;background:#fff}
.nav-title{font-size:11px;font-weight:900;color:#98a2b3;text-transform:uppercase;letter-spacing:.1em;padding:12px}
.nav{display:grid;gap:4px}
.nav button{border:0;background:transparent;text-align:left;border-radius:12px;padding:10px 12px;color:#344054;font-weight:750}
.nav button:hover,.nav button.active{background:var(--soft);color:var(--green)}
.main{padding:22px 20px 100px;min-width:0}
.hero{background:linear-gradient(135deg,#075c36 0%,#087443 55%,#0d9258 100%);color:#fff;border-radius:26px;padding:34px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-90px;background:rgba(255,255,255,.09)}
.hero h1{font-size:clamp(30px,5vw,50px);line-height:1.08;margin:0 0 12px;max-width:760px}
.hero p{max-width:760px;margin:0 0 20px;color:#e9fff3}
.welcome{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:14px 16px;margin-top:18px}
.hero-actions{display:flex;flex-wrap:wrap;gap:9px}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:850}
.btn-primary{background:var(--gold);color:#1b1b1b}.btn-white{background:#fff;color:var(--green)}
.btn-soft{background:var(--soft);color:var(--green);border:1px solid #ccebd9}.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:30px 0 13px}
.section-head h2{margin:0;font-size:23px}.section-head p{margin:2px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 22px rgba(16,42,67,.045)}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.card h3{margin:7px 0 5px;font-size:17px}.card p{margin:0;color:var(--muted);font-size:13px}
.card button{margin-top:14px}
.core-icon{font-size:28px}
.badge{display:inline-flex;align-items:center;gap:5px;background:#f2f4f7;color:#475467;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900}
.badge.green{background:var(--soft);color:var(--green)}
.path{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px;margin:4px 0 15px}
.path button{border:0;background:transparent;color:var(--green);font-weight:800;padding:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.subject-btn,.topic-btn{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;font-weight:850}
.subject-btn:hover,.topic-btn:hover{border-color:#9bd7b8;background:var(--soft)}
.topic-list{display:grid;gap:9px}
.topic-btn{display:flex;justify-content:space-between;align-items:center}
.lesson{max-width:900px;margin:auto}
.lesson h1{font-size:34px;line-height:1.15;margin:4px 0 8px}
.lesson h2{margin-top:30px;border-left:5px solid var(--green);padding-left:11px}
.lesson h3{margin-top:22px}
.lesson .definition{background:var(--soft);border:1px solid #ccebd9;padding:16px;border-radius:14px}
.lesson .exam{background:#fffbeb;border:1px solid #f7df9a;padding:16px;border-radius:14px}
.lesson .mistake{background:#fff7ed;border:1px solid #fed7aa;padding:16px;border-radius:14px}
.diagram-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:16px 0;text-align:center}
.diagram-box img{max-width:100%;max-height:520px;object-fit:contain;border-radius:10px}
.diagram-caption{font-size:12px;color:var(--muted);margin-top:8px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi .card strong{font-size:25px;display:block;color:var(--green)}
.notice{background:#f8fafc;border:1px solid var(--line);padding:14px;border-radius:14px;font-size:13px}
.bottom-nav{display:none}
.empty{text-align:center;padding:45px 15px;color:var(--muted)}
.footer{margin-top:40px;padding:28px 5px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}.sidebar{position:fixed;left:-280px;top:65px;bottom:0;width:270px;z-index:45;transition:.25s;box-shadow:var(--shadow)}.sidebar.open{left:0}.menu-btn{display:block}.brand{min-width:auto}.brand small{display:none}.search{max-width:none}.header-actions .icon-btn{display:none}
}
@media(max-width:650px){
  .main{padding:12px 12px 90px}.hero{padding:24px 18px;border-radius:21px}.hero h1{font-size:31px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:14px}.kpi{grid-template-columns:repeat(2,1fr)}.section-head{align-items:start;flex-direction:column}.bottom-nav{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:60;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 5px env(safe-area-inset-bottom)}.bottom-nav button{border:0;background:transparent;font-size:10px;font-weight:850;color:#667085}.bottom-nav button span{display:block;font-size:18px}.lesson h1{font-size:27px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="topbar-inner">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <a class="brand" href="#" onclick="goHome();return false;">
      <div class="logo">P</div><div><strong>PASSCOGH-MODOO</strong><small>Learn • Practise • Pass</small></div>
    </a>
    <div class="search"><span>🔎</span><input id="searchBox" placeholder="Search subjects, topics, materials..." oninput="searchSite(this.value)"></div>
    <div class="header-actions"><button class="icon-btn" onclick="showHome()">🏠</button><button class="icon-btn" onclick="showAbout()">ℹ️</button></div>
  </div>
</header>

<div class="layout">
<aside id="sidebar" class="sidebar">
  <div class="nav-title">Main learning</div>
  <div class="nav">
    <button onclick="showHome()">🏠 Home</button>
    <button onclick="showCore('pre-shs')">🌱 Pre-SHS</button>
    <button onclick="showCore('jhs')">📘 JHS</button>
    <button onclick="showCore('shs')">🎓 SHS</button>
    <button onclick="showCore('pre-university')">🚀 Pre-University</button>
    <button onclick="showCore('universities')">🏛️ Universities & Colleges</button>
  </div>
  <div class="nav-title">Explore</div>
  <div class="nav">
    <button onclick="showFeature('courses')">💻 Courses & Skills</button>
    <button onclick="showFeature('materials')">📚 Learning Materials</button>
    <button onclick="showFeature('exam')">📝 Exam Preparation</button>
    <button onclick="showFeature('practical')">🧪 Practical Centre</button>
    <button onclick="showFeature('formula')">🧮 Formula Bag</button>
    <button onclick="showFeature('wassce')">🎯 WASSCE</button>
    <button onclick="showFeature('predicted')">🔮 2027 Predicted Practice</button>
    <button onclick="showFeature('guidance')">🧭 Course & Institution Guide</button>
  </div>
  <div class="nav-title">PASSCOGH-MODOO</div>
  <div class="nav"><button onclick="showAbout()">👤 Creator & Mission</button></div>
</aside>

<main id="main" class="main"></main>
</div>

<nav class="bottom-nav">
  <button onclick="showHome()"><span>🏠</span>Home</button>
  <button onclick="showCore('jhs')"><span>📘</span>JHS</button>
  <button onclick="showCore('shs')"><span>🎓</span>SHS</button>
  <button onclick="showFeature('materials')"><span>📚</span>Materials</button>
  <button onclick="showFeature('exam')"><span>📝</span>Exam</button>
</nav>
</div>

<script>
const DATA_PATHS=[
  "data/curriculum.json",
  "data/curriculum/curriculum.json",
  "data/curriculum/official-registry.json"
];
const DIAGRAM_ROOT="data/diagrams/";
let curriculum=null, current={core:null,level:null,programme:null,subject:null,topic:null};

const cores={
 "pre-shs":{title:"Pre-SHS",icon:"🌱",desc:"Build the foundation you need before entering Senior High School."},
 "jhs":{title:"JHS",icon:"📘",desc:"JHS 1–3 learning, revision and preparation for the next stage."},
 "shs":{title:"SHS",icon:"🎓",desc:"SHS 1–3 programmes, subjects, detailed topics and WASSCE preparation."},
 "pre-university":{title:"Pre-University",icon:"🚀",desc:"Prepare for tertiary education, course choices and the transition beyond SHS."},
 "universities":{title:"Universities & Colleges",icon:"🏛️",desc:"Explore tertiary pathways, course-fit guidance and institution information."}
};

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function closeSidebar(){document.getElementById("sidebar").classList.remove("open")}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open")}
function path(items){return `<div class="path">${items.map((x,i)=>i?`<span>›</span><button onclick="${x.fn||''}">${esc(x.t)}</button>`:`<button>${esc(x.t)}</button>`).join("")}</div>`}
function setMain(html){document.getElementById("main").innerHTML=html;closeSidebar();window.scrollTo({top:0,behavior:"smooth"})}

async function loadCurriculum(){
  for(const p of DATA_PATHS){
    try{const r=await fetch(p,{cache:"no-store"});if(r.ok){curriculum=await r.json();return curriculum}}catch(e){}
  }
  return null;
}
function normalise(obj){
  if(!obj)return[];
  if(Array.isArray(obj))return obj;
  if(Array.isArray(obj.subjects))return obj.subjects;
  if(Array.isArray(obj.items))return obj.items;
  if(Array.isArray(obj.courses))return obj.courses;
  return Object.entries(obj).map(([key,value])=>({id:key,name:key,...(typeof value==="object"?value:{})}));
}
function getLevels(core){
  if(core==="jhs")return ["JHS 1","JHS 2","JHS 3"];
  if(core==="shs")return ["SHS 1","SHS 2","SHS 3"];
  if(core==="pre-shs")return ["Foundation"];
  if(core==="pre-university")return ["Transition & Preparation"];
  if(core==="universities")return ["Universities & Colleges"];
  return[];
}
function subjectNamesFor(core,level){
  const common={
    "JHS 1":["English Language","Mathematics","Integrated Science","Social Studies","Computing","Religious & Moral Education","French","Ghanaian Language"],
    "JHS 2":["English Language","Mathematics","Integrated Science","Social Studies","Computing","Religious & Moral Education","French","Ghanaian Language"],
    "JHS 3":["English Language","Mathematics","Integrated Science","Social Studies","Computing","Religious & Moral Education","French","Ghanaian Language"],
    "Foundation":["Mathematics","English Language","Science Foundations","Study Skills"],
    "Transition & Preparation":["Study Skills","Career Exploration","University Readiness"],
    "Universities & Colleges":["Course Selection","Institution Guidance","Admission Readiness","Academic Success"]
  };
  return common[level]||[];
}
const shsProgrammes={
 "General Science":["Biology","Chemistry","Physics","Elective Mathematics","English Language"],
 "General Arts":["Government","Economics","Geography","History","Literature in English","English Language"],
 "Business":["Financial Accounting","Business Management","Economics","Cost Accounting","English Language"],
 "Home Economics":["Food and Nutrition","Management in Living","Clothing and Textiles","General Agriculture"],
 "Visual Arts":["Graphic Design","Picture Making","Sculpture","Ceramics","Textiles"],
 "Agriculture":["General Agriculture","Animal Husbandry","Crop Husbandry","Agricultural Science"],
 "Technical / Vocational":["Applied Electricity","Building Construction","Technical Drawing","ICT / Computing"]
};

function showHome(){
  setMain(`
  <section class="hero">
    <div class="badge" style="background:rgba(255,255,255,.13);color:#fff">🇬🇭 BUILT FOR GHANAIAN LEARNERS</div>
    <h1>Welcome to PASSCOGH-MODOO 👋</h1>
    <p>Learn with clarity. Practise with purpose. Prepare with confidence. Move from foundation learning to SHS, WASSCE, tertiary guidance and useful skills in one organised learning space.</p>
    <div class="hero-actions">
      <button class="btn btn-primary" onclick="showCore('shs')">Start SHS Learning →</button>
      <button class="btn btn-white" onclick="showCore('jhs')">Explore JHS</button>
      <button class="btn btn-white" onclick="showFeature('exam')">Exam Preparation</button>
    </div>
    <div class="welcome"><strong>A welcome from the creator</strong><br>“You are welcome to PASSCOGH-MODOO. My goal is to make learning clearer, more practical and easier to navigate, so that every learner can find what they need, understand it, practise it and keep progressing.”<br><strong>— Awudu Mohammed Modoo Ayariga</strong></div>
  </section>

  <div class="section-head"><div><h2>Explore the platform</h2><p>Choose a core part first, then move into levels, programmes, subjects and topics.</p></div></div>
  <div class="grid">${Object.entries(cores).map(([id,c])=>`
    <article class="card"><div class="core-icon">${c.icon}</div><span class="badge green">${esc(c.title)}</span><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><button class="btn btn-soft" onclick="showCore('${id}')">Open ${esc(c.title)} →</button></article>`).join("")}</div>

  <div class="section-head"><div><h2>Learning & exam tools</h2><p>Major services have their own clear entry points.</p></div></div>
  <div class="grid">${[
    ["📚","Learning Materials","Read and revise organised materials.","materials"],
    ["🧪","Practical Centre","Practical guidance, observations and exam preparation.","practical"],
    ["🧮","Formula Bag","Quick access to important formulas and working rules.","formula"],
    ["🎯","WASSCE Preparation","Past-question study and exam-focused practice.","wassce"],
    ["🔮","2027 Predicted Practice","PASSCOGH-MODOO predictions clearly labelled as predictions.","predicted"],
    ["💻","Courses & Skills","Useful skills and certificate-oriented learning pathways.","courses"],
    ["🧭","Course & Institution Guide","Prepare for tertiary choices and pathways.","guidance"],
    ["👤","Creator & Mission","Meet the creator and understand the platform mission.","about"]
  ].map(x=>`<article class="card"><div class="core-icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button class="btn btn-outline" onclick="${x[3]==="about"?"showAbout()":"showFeature('"+x[3]+"')"}">Open →</button></article>`).join("")}</div>
  <div class="footer">PASSCOGH-MODOO • Learn • Practise • Pass • Ghana</div>`);
}

function showCore(core){
  const c=cores[core];
  current={core,level:null,programme:null,subject:null,topic:null};
  const levels=getLevels(core);
  setMain(`${path([{t:"Home",fn:"showHome()"},{t:c.title}])}
  <section class="panel"><span class="badge green">${c.icon} ${c.title}</span><h1 style="margin-bottom:5px">${c.title}</h1><p style="color:var(--muted)">${c.desc}</p>
  <div class="section-head"><div><h2>Choose your next level</h2><p>This keeps the platform organised instead of mixing different learner stages.</p></div></div>
  <div class="grid">${levels.map(l=>`<article class="card"><span class="badge">${esc(l)}</span><h3>${esc(l)}</h3><p>Open ${esc(l)} and continue to the relevant programme or subjects.</p><button class="btn btn-primary" onclick="showLevel('${core}',${JSON.stringify(l)})">Open →</button></article>`).join("")}</div></section>`);
}

function showLevel(core,level){
  current={core,level,programme:null,subject:null,topic:null};
  if(core==="shs")return showSHSProgramme();
  return showSubjects(core,level,subjectNamesFor(core,level));
}
function showSHSProgramme(){
  setMain(`${path([{t:"SHS",fn:"showCore('shs')"},{t:current.level}])}
  <section class="panel"><span class="badge green">🎓 SHS PROGRAMMES</span><h1>Choose your programme</h1><p style="color:var(--muted)">Select a programme first. Your subjects are then kept together instead of mixing every SHS subject on one screen.</p>
  <div class="grid">${Object.entries(shsProgrammes).map(([p,subs])=>`<article class="card"><span class="badge">${subs.length} core learning areas</span><h3>${esc(p)}</h3><p>${subs.slice(0,4).map(esc).join(" • ")}${subs.length>4?" • …":""}</p><button class="btn btn-primary" onclick="showProgramme(${JSON.stringify(p)})">Open programme →</button></article>`).join("")}</div></section>`);
}
function showProgramme(programme){
  current.programme=programme;
  showSubjects("shs",current.level,shsProgrammes[programme]||[]);
}
function showSubjects(core,level,subjects){
  current.subject=null;current.topic=null;
  setMain(`${path([{t:cores[core]?.title||core,fn:`showCore('${core}')`},{t:level},{t:current.programme||"Subjects"}])}
  <section class="panel"><span class="badge green">📘 SUBJECTS</span><h1>${esc(current.programme||level)}</h1><p style="color:var(--muted)">Each subject has its own entry point. Tap a subject to reach its topic list.</p>
  <div class="subject-grid">${subjects.map(s=>`<button class="subject-btn" onclick="showSubject(${JSON.stringify(s)})">📘 ${esc(s)} <span style="float:right">›</span></button>`).join("")}</div>
  </section>`);
}
function showSubject(subject){
  current.subject=subject;current.topic=null;
  const topics=findTopics(subject);
  setMain(`${path([{t:current.core==="shs"?"SHS":cores[current.core]?.title||"Learning",fn:`showCore('${current.core}')`},{t:current.level},{t:current.programme||"Subjects"},{t:subject}])}
  <section class="panel"><span class="badge green">📘 SUBJECT</span><h1>${esc(subject)}</h1><p style="color:var(--muted)">Choose a topic. Each topic opens the full lesson structure: explanation, key terms, concepts, examples, diagrams, practical/application, practice, answers and exam preparation where applicable.</p>
  <div class="topic-list">${topics.map((t,i)=>`<button class="topic-btn" onclick="openTopic(${JSON.stringify(t.name||t.title||t)},${JSON.stringify(t)})"><span>${i+1}. ${esc(t.name||t.title||t)}</span><span>→</span></button>`).join("")}</div>
  ${topics.length?`<div class="notice" style="margin-top:16px">Topic content is loaded from the curriculum data when available. The interface does not replace the actual lesson content with placeholder text.</div>`:`<div class="empty">No topic records were found in the currently loaded curriculum data for this subject.</div>`}
  </section>`);
}

function findTopics(subject){
  // Prefer loaded curriculum records, while keeping a safe navigation fallback.
  const hits=[];
  const walk=(v)=>{
    if(!v||typeof v!=="object")return;
    if(Array.isArray(v)){v.forEach(walk);return}
    const n=String(v.subject||v.subjectName||v.course||"").toLowerCase();
    if(n===subject.toLowerCase()||n.includes(subject.toLowerCase())){
      const arr=v.topics||v.units||v.strands||v.sections;
      if(Array.isArray(arr))arr.forEach(x=>hits.push(typeof x==="string"?{name:x}:x));
    }
    Object.values(v).forEach(walk);
  };
  walk(curriculum);
  if(hits.length)return hits;
  // Small navigation fallback; actual detailed content should come from curriculum data.
  const fallback={
    Biology:["Cell Structure and Organisation","Biological Molecules","Nutrition","Transport in Plants and Animals","Respiration","Photosynthesis","Excretion","Coordination","Reproduction","Genetics","Evolution","Ecology","Microorganisms","Disease and Immunity"],
    Chemistry:["Atomic Structure","Chemical Bonding","Stoichiometry","States of Matter","Energetics","Rates of Reaction","Equilibrium","Acids and Bases","Organic Chemistry","Electrochemistry"],
    Physics:["Measurement","Mechanics","Thermal Physics","Waves","Electricity","Magnetism","Electronics","Modern Physics"],
    Mathematics:["Algebra","Geometry","Trigonometry","Calculus","Statistics","Probability","Vectors"],
    "English Language":["Comprehension","Summary","Grammar","Vocabulary","Oral English","Writing"],
    "Integrated Science":["Matter","Energy","Living Systems","Environment","Health","Technology"]
  };
  return (fallback[subject]||[]).map(name=>({name}));
}

function openTopic(name,obj={}){
  current.topic=name;
  const rich=obj.content||obj.lesson||obj.notes||obj.description||"";
  const diagram=obj.diagram||obj.diagramPath||obj.image||"";
  const content=rich||`<p>This topic is connected to the curriculum system. Its detailed lesson content should be supplied by the curriculum data source rather than being fabricated by the interface.</p>`;
  setMain(`${path([{t:current.core==="shs"?"SHS":cores[current.core]?.title||"Learning",fn:`showCore('${current.core}')`},{t:current.level,fn:`showLevel('${current.core}','${current.level}')`},{t:current.programme||"Subjects"},{t:current.subject,fn:`showSubject(${JSON.stringify(current.subject)})`},{t:name}])}
  <article class="panel lesson">
    <span class="badge green">📖 TOPIC LESSON</span>
    <h1>${esc(name)}</h1>
    <p style="color:var(--muted)">A structured PASSCOGH-MODOO lesson</p>
    <div class="definition"><strong>Learning standard</strong><br>Learn the concept clearly, connect it to real situations, practise it and prepare to explain it in an examination.</div>

function searchSite(q){
  if(!q.trim()){return}
  const lower=q.toLowerCase();
  const matches=[];
  const walk=(v)=>{
    if(!v||typeof v!=="object")return;
    if(Array.isArray(v)){v.forEach(walk);return}
    const label=String(v.name||v.title||v.subject||"");
    if(label.toLowerCase().includes(lower))matches.push(v);
    Object.values(v).forEach(walk);
  };
  walk(curriculum);
  setMain(`<section class="panel"><span class="badge green">🔎 SEARCH</span><h1>Results for “${esc(q)}”</h1>${matches.slice(0,30).map(x=>`<button class="topic-btn" style="margin-top:8px" onclick="openTopic(${JSON.stringify(x.name||x.title||q)},${JSON.stringify(x)})">${esc(x.name||x.title||x.subject||q)} <span>→</span></button>`).join("")||`<div class="empty">No matching curriculum record found.</div>`}</section>`);
}

loadCurriculum().finally(showHome);
