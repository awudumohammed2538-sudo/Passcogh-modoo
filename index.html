<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PASSCO GH MODOO</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#fafafa]">
<header class="bg-white border-b p-3 flex justify-between items-center"><div class="flex gap-2 items-center"><img src="passco_gh_logo_horizontal.webp" class="w-10 h-10 rounded-full object-cover bg-yellow-400"><div><p class="font-black text-xs">PASSCO GH</p><p class="font-black text-yellow-600 -mt-1">MODOO</p></div></div><div class="bg-yellow-400 px-3 py-2 rounded-full text-xs font-black">📚 Lib <span id="libCount">0</span></div></header>
<div class="p-4 max-w-4xl mx-auto"><div class="bg-white rounded-[2rem] p-5 border-2 border-yellow-200 flex gap-4"><img src="founder_ceo_portrait.webp" class="w-28 h-28 rounded-[1.5rem] object-cover border-4 border-yellow-400"><div><h1 class="font-black text-lg leading-tight">WASSCE 2010-2025 + BECE + Marking</h1><p class="text-xs mt-1 font-bold">By Awudu Mohammed (MODOO) - Kpandai</p><p class="text-[10px] text-gray-500 mt-1">From Kpandai to Ghana. Your GH¢1 fund maintains site. MoMo 0543372778</p><span class="mt-2 inline-block bg-black text-white text-[10px] px-2 py-1 rounded-full">TAPPING WORKS ✅</span></div></div>
<div class="mt-4 grid gap-3" id="grid"></div></div>
<div id="reader" style="display:none" class="fixed inset-0 bg-white z-50 overflow-auto"><div class="bg-black text-white p-3 flex justify-between sticky top-0"><button onclick="document.getElementById('reader').style.display='none'" class="bg-white text-black px-3 py-1 rounded-full text-xs font-bold">← Back</button><p class="font-bold text-sm">Reader</p></div><div class="p-4 max-w-3xl mx-auto"><h2 id="rtitle2" class="font-black text-xl"></h2><div id="rbody" class="mt-4"></div></div></div>
<script>
let myLibrary=JSON.parse(localStorage.getItem('myLibrary')||'[]');let freeUsed=parseInt(localStorage.getItem('freeUsed_v2')||'0');let cur=null;
let books=[{id:101,name:'JHS Maths BECE - BODMAS',topics:[{t:'BODMAS Fractions (Likely 2025)',n:'LCM HCF',w:'Working 2 + Ans 1',h:'Show steps',l:'2½+1¾ (3mks)',d:'Number line',k:'BODMAS'}]},{id:1,name:'Biology WASSCE - Cell & Heart',topics:[{t:'Animal Cell',n:'Cell unit',w:'Def 2 + 4 organelles 4 + diagram 4 =10',h:'Define + list + draw',l:'Animal cell (8mks) Likely',d:'Nucleus, Mitochondrion',k:'MRS GREN'}]}];
function render(){document.getElementById('libCount').innerText=myLibrary.length;let g=document.getElementById('grid');g.innerHTML='';books.forEach(s=>{g.innerHTML+=`<div class="bg-white p-4 rounded-2xl border"><p class="font-black text-sm">${s.name}</p><button onclick="openBook(${s.id})" class="mt-3 w-full ${myLibrary.includes(s.id)?'bg-green-600':'bg-black'} text-white py-3 rounded-full text-xs font-black">${myLibrary.includes(s.id)?'✅ READ NOW - TAP':'👉 TAP TO OPEN - FREE 1ST'}</button></div>`});}
function openBook(id){let b=books.find(x=>x.id==id);cur=b;if(myLibrary.includes(id)){showReader(b);return;}if(freeUsed<1){myLibrary.push(id);freeUsed=1;localStorage.setItem('myLibrary',JSON.stringify(myLibrary));localStorage.setItem('freeUsed_v2','1');render();showReader(b);}else{alert('🙏 MoMo 0543372778 - GH¢1 to unlock. Enter any ID');let t=prompt('Enter MoMo Transaction ID:');if(t){myLibrary.push(id);localStorage.setItem('myLibrary',JSON.stringify(myLibrary));render();showReader(b);}}}
function showReader(book){document.getElementById('rtitle2').innerText=book.name;let c=document.getElementById('rbody');c.innerHTML='';book.topics.forEach((tp,i)=>{c.innerHTML+=`<div class="border rounded-2xl p-4 bg-gray-50 mb-4"><p class="font-black text-sm">${i+1}. ${tp.t}</p><div class="mt-2 bg-white p-3 rounded-xl text-xs border"><b>📘 Notes:</b> ${tp.n}</div><div class="mt-2 bg-yellow-50 p-3 rounded-xl text-xs border border-yellow-200"><b>🎯 Marking:</b> ${tp.w}</div><div class="mt-2 bg-blue-50 p-3 rounded-xl text-xs border border-blue-200"><b>✅ How to get full marks:</b> ${tp.h}</div><div class="mt-2 bg-purple-50 p-3 rounded-xl text-xs border border-purple-200"><b>🔥 Likely:</b> ${tp.l}</div></div>`});document.getElementById('reader').style.display='block';}
render();
</script></body></html>
