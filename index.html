<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PASSCO FINAL</title><script src="https://cdn.tailwindcss.com"></script></head><body>
<header><img src="passco_gh_logo_horizontal.webp" style="width:40px;height:40px;border-radius:50%"><b>PASSCO GH MODOO</b> <button onclick="openLib()">Lib</button><button onclick="openLogin()">Login</button></header>
<div><img src="founder_ceo_portrait.webp" style="width:80px;height:80px"><h1>FINAL GH1+GH5 LOGO+PHOTO+LOGIN+30T+UNI</h1><button onclick="show('jhs')">JHS 6x32T GH1</button><button onclick="show('shs')">SHS 7 Courses x30T GH1</button><button onclick="show('uni')">UNI GH5</button></div>
<div id="jhs"><h2>JHS 6 Subjects GH1</h2><div id="gjhs"></div></div><div id="shs" style="display:none"><div id="gshs"></div></div><div id="uni" style="display:none"><h2>Uni Premium GH5 MoMo 0543372778</h2><button onclick="openUniPay()">Unlock GH5</button><div id="ur"></div></div>
<div id="reader" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:white;overflow:auto"><button onclick="closeReader()">Back</button><div id="rb"></div></div>
<script>
let lib=JSON.parse(localStorage.getItem('myLibrary')||'[]');let user=JSON.parse(localStorage.getItem('passcoUser')||'null');let uni=localStorage.getItem('uniUnlocked')=='1';
let jhs=["JHS Maths (32T Y1-3 GH1)","JHS Science (32T)","JHS English (32T)","JHS Social (32T)","JHS RME (32T)","JHS BDT (32T)"];let topics=["Fractions","BODMAS","Sets","Ratio","Geometry","Triangles","Stats","Mensuration","Algebra","Equations","Quadratic","Vectors","Trigo","Calculus","Probability","Log","Surds","Indices","Variation","Matrices","Bearings","Construction","Transformation","NumberBase","Fin Maths","Functions","Inequalities","CircleTh","Past Y1","Past Y2","Past Y3","Likely"];
function render(){let h="";for(let i=0;i<jhs.length;i++){h+=`<div style="border:1px solid #ccc;padding:8px;margin:4px"><b>${jhs[i]}</b> <button onclick="toggle(${i})">View 32 GH1</button><div id="jhs-${i}" style="display:none">`;for(let j=0;j<32;j++){let yr=j<11?"Y1":j<22?"Y2":"Y3";h+=`<div>${yr}: ${topics[j%topics.length]} <button onclick="openTopic('${topics[j%topics.length]}')">Open</button></div>`;}h+=`</div></div>`;}document.getElementById('gjhs').innerHTML=h;}
function toggle(i){document.getElementById('jhs-'+i).style.display=document.getElementById('jhs-'+i).style.display=='none'?'block':'none';}
function openTopic(t){document.getElementById('reader').style.display='block';document.getElementById('rb').innerHTML=`<h2>${t}</h2><p>Notes for ${t} Y1-3</p><p>WAEC Marking Def2+4+4=10</p><p>How to get full marks</p><p>Likely Q</p><p>Diagram</p>`;}
function closeReader(){document.getElementById('reader').style.display='none';}
function show(t){document.getElementById('jhs').style.display=t=='jhs'?'block':'none';document.getElementById('shs').style.display=t=='shs'?'block':'none';document.getElementById('uni').style.display=t=='uni'?'block':'none';}
function openLib(){alert('Library: '+lib.length+' books GH1+GH5 MoMo 0543372778');}
function openLogin(){let n=prompt('Name');let p=prompt('Password');if(n&&p){localStorage.setItem('passcoUser',JSON.stringify({name:n}));alert('Logged in '+n);}}
function openUniPay(){let id=prompt('MoMo ID for GH5 0543372778');if(id){localStorage.setItem('uniUnlocked','1');alert('Uni GH5 Unlocked');}}
render();
</script></body></html>
